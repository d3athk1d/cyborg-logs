<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethelgard Elite Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gatekeeper: {
                            50: '#f0f4ff', 100: '#d9e2ff', 200: '#bbcbff', 300: '#8da6ff',
                            400: '#5876ff', 500: '#3449ff', 600: '#1e26ff', 700: '#1418ff',
                            800: '#1215cc', 900: '#1619a0', 950: '#0a0b5e',
                        },
                        ethereal: '#0a0a0c',
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        body: ['Space+Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0c; color: #ffffff; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* Interactive Mesh & Bubble Background */
        .mesh-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: 
                radial-gradient(circle at 20% 30%, rgba(52, 73, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(30, 38, 255, 0.05) 0%, transparent 40%);
        }

        /* Glassmorphism Cards */
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; 
            transition: all 0.5s ease;
        }

        /* Initial Hidden State for Animation */
        .scroll-reveal { 
            opacity: 0; 
            transform: translateY(40px); 
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* State when visible */
        .scroll-reveal.visible { 
            opacity: 1; 
            transform: translateY(0); 
        }

        .gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #8da6ff 50%, #3449ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

    </nav>
