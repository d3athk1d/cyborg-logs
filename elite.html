    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {

                    animation: {
                        'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',

                    keyframes: {

                            '0%, 100%': { transform: 'translateY(0)' },

                    }
                }
            }
        }

        body {
            background-color: #0a0a0c;
            color: #ffffff;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        .gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #8da6ff 50%, #3449ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;

                        radial-gradient(circle at 80% 70%, rgba(30, 38, 255, 0.05) 0%, transparent 40%);
            transition: background 0.3s ease;
