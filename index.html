<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHELGARD // ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .synco { font-family: 'Syncopate', sans-serif; }
        .accent-line { width: 2px; height: 100px; background: linear-gradient(to bottom, #3449ff, transparent); }
        .scanline {
            width: 100%; height: 2px; background: rgba(52, 73, 255, 0.1);
            position: absolute; top: 0; animation: scan 8s linear infinite;
        }
        @keyframes scan { from { top: 0%; } to { top: 100%; } }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row">
    <div class="scanline"></div>

    <div class="w-full md:w-1/3 h-full border-r border-white/10 flex flex-col justify-between p-12 relative z-10 bg-black">
        <div>
            <div class="accent-line mb-8"></div>
            <h2 class="synco text-xs tracking-[0.5em] text-blue-500 mb-2 uppercase">System Status</h2>
            <p class="text-[10px] text-white/40 font-mono tracking-widest uppercase">Node_Active // 001</p>
        </div>

        <div>
            <h1 class="synco text-4xl font-bold leading-tight mb-6 uppercase tracking-tighter">
                New<br><span class="text-blue-600">Protocol</span>
            </h1>
            <p class="text-sm text-white/60 font-light leading-relaxed mb-8">
                A total redesign of the Aethelgard interface. Streamlined access to digital assets and marketing infrastructure.
            </p>
            <a href="portal.html" class="inline-block border border-white/20 px-8 py-4 hover:bg-blue-600 hover:border-blue-600 transition-all duration-500 synco text-[10px] tracking-[0.3em] uppercase">
                Initialize Gateway
            </a>
        </div>

        <div class="text-[9px] text-white/20 font-mono tracking-[0.4em] uppercase">
            © 2026 Aethelgard // All Rights Reserved
        </div>
    </div>

    <div class="hidden md:block w-2/3 h-full relative overflow-hidden bg-zinc-900">
        <video 
            src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-blue-and-white-particles-23131-large.mp4" 
            autoplay muted loop playsinline 
            class="absolute inset-0 w-full h-full object-cover opacity-50 grayscale hover:grayscale-0 transition-all duration-1000">
        </video>
        <div class="absolute inset-0 bg-gradient-to-r from-black via-transparent to-transparent"></div>
    </div>
</body>
</html>
