<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AETHELGARD // ENCRYPTION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #3449ff; font-family: monospace; overflow: hidden; }
        .glitch { animation: glitch 1s linear infinite; }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        input { 
            background: transparent; border: none; color: #fff; 
            font-size: 2rem; letter-spacing: 0.5em; text-align: center;
            width: 100%; outline: none; text-transform: uppercase;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-12">

    <div class="max-w-2xl w-full">
        <div class="mb-12 flex justify-between items-end border-b border-blue-900/50 pb-4">
            <div>
                <p class="text-[10px] tracking-[0.5em] opacity-40 uppercase mb-2">Security_Protocol</p>
                <h2 class="text-xl tracking-widest uppercase italic">Verification_Required</h2>
            </div>
            <div class="text-right">
                <p id="timer" class="text-xs font-mono opacity-40">SESSION_EXPIRES: 04:59</p>
            </div>
        </div>

        <div class="py-20 relative">
            <input type="password" id="passkey" placeholder="••••••••" autofocus>
            <div id="status" class="mt-8 text-center text-[10px] tracking-[0.8em] opacity-30 uppercase">
                Awaiting Authorization Key
            </div>
        </div>

        <div class="grid grid-cols-4 gap-4 opacity-10">
            <div class="h-1 bg-blue-500"></div>
            <div class="h-1 bg-blue-500"></div>
            <div class="h-1 bg-blue-500"></div>
            <div class="h-1 bg-blue-500"></div>
        </div>
    </div>

    <script>
        const passkey = document.getElementById('passkey');
        const status = document.getElementById('status');

        passkey.addEventListener('input', (e) => {
            if (e.target.value.toUpperCase() === 'AETHELGARD') {
                status.innerText = "ACCESS GRANTED // REDIRECTING";
                status.classList.add('text-white', 'opacity-100', 'glitch');
                passkey.style.color = '#3449ff';
                setTimeout(() => {
                    // Change this to your new destination page later
                    alert('Identity Confirmed.');
                }, 1000);
            }
        });

        // Simple visual countdown
        let mins = 4, secs = 59;
        setInterval(() => {
            if (secs > 0) secs--;
            else { mins--; secs = 59; }
            document.getElementById('timer').innerText = `SESSION_EXPIRES: 0${mins}:${secs < 10 ? '0'+secs : secs}`;
        }, 1000);
    </script>
</body>
</html>
