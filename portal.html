<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AETHELGARD // GATEWAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #3449ff; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; padding: 40px; border: 1px solid rgba(52, 73, 255, 0.2); }
        input { background: transparent; border: none; border-bottom: 2px solid #3449ff; color: #fff; padding: 10px; text-align: center; outline: none; width: 300px; font-size: 1.5rem; letter-spacing: 5px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="box">
        <div class="mb-6 opacity-40 text-[10px] tracking-[0.5em]">ENCRYPTION_REQUIRED</div>
        <input type="password" id="gate" placeholder="********" autofocus>
        <div id="status" class="mt-4 text-[10px] tracking-widest opacity-60 uppercase">Awaiting_Input...</div>
    </div>
    <script>
        const gate = document.getElementById('gate');
        gate.addEventListener('input', (e) => {
            if (e.target.value.toUpperCase() === 'AETHELGARD') {
                document.getElementById('status').innerText = "ACCESS_GRANTED";
            }
        });
    </script>
</body>
</html>
