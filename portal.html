<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethelgard Elite Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0c; color: #ffffff; font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; }
        .mesh-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 50%, rgba(52, 73, 255, 0.15) 0%, transparent 50%); transition: 1s; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        
        /* Initial state: Locked */
        #mainSiteContent { display: none; opacity: 0; transition: opacity 1.5s ease; }
        #loginOverlay { transition: 0.8s ease; }
        
        .unlocked .mesh-bg { background: radial-gradient(circle at 20% 30%, rgba(52, 73, 255, 0.2) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(0, 255, 136, 0.15) 0%, transparent 40%); }
    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <div id="loginOverlay" class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <h1 class="font-bold text-4xl mb-8 tracking-tighter uppercase font-['Outfit']">System Locked</h1>
        <div class="w-full max-w-md glass-card p-8">
            <p class="text-[10px] uppercase tracking-[0.3em] text-zinc-500 mb-4">Enter Override Password</p>
            <input type="text" id="cmdInput" placeholder="PASSWORD..." class="bg-transparent border-b border-white/10 outline-none text-center text-xl w-full text-white uppercase tracking-widest pb-2 focus:border-gatekeeper-500 transition-all">
        </div>
    </div>

    <div id="mainSiteContent" class="p-6 md:p-12 max-w-7xl mx-auto">
        <nav class="w-full flex justify-between items-center mb-16">
            <a href="index.html" class="px-4 py-2 border border-white/20 rounded-full text-xs uppercase tracking-widest hover:bg-white hover:text-black transition-all">← Hub</a>
            <span class="text-gatekeeper-300 text-xs tracking-widest">ACCESS: GRANTED</span>
        </nav>

        <header class="text-center mb-20">
            <h1 class="text-6xl md:text-9xl font-['Outfit'] font-black mb-6 tracking-tighter leading-none">
                AETHELGARD<br><span class="text-blue-600">INFRASTRUCTURE</span>
            </h1>
            <p class="text-zinc-400 max-w-xl mx-auto">Independent distribution node for audio assets and private blueprints. Total control established.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-20">
            <div class="glass-card p-10 h-64 flex flex-col justify-end">
                <h3 class="text-2xl font-bold mb-2 uppercase tracking-tighter">Audio Vault</h3>
                <p class="text-zinc-500 text-sm italic">Status: 02 Files Encrypted</p>
            </div>
            <div class="glass-card p-10 h-64 flex flex-col justify-end">
                <h3 class="text-2xl font-bold mb-2 uppercase tracking-tighter">Project Ghost</h3>
                <p class="text-zinc-500 text-sm italic">Status: Syncing...</p>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('cmdInput');
        const login = document.getElementById('loginOverlay');
        const content = document.getElementById('mainSiteContent');

        input.addEventListener('input', (e) => {
            if (e.target.value.toUpperCase() === 'AETHELGARD') {
                // Fade out login
                login.style.opacity = '0';
                
                setTimeout(() => {
                    login.style.display = 'none';
                    // Reveal content
                    content.style.display = 'block';
                    document.body.classList.add('unlocked');
                    setTimeout(() => {
                        content.style.opacity = '1';
                    }, 50);
                }, 800);
            }
        });
    </script>
</body>
</html>
