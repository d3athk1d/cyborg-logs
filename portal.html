<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethelgard Elite Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gatekeeper: { 300: '#8da6ff', 500: '#3449ff', 600: '#1e26ff' },
                    },
                    fontFamily: { display: ['Outfit', 'sans-serif'], body: ['Space+Grotesk', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0c; color: #ffffff; scroll-behavior: smooth; }
        .mesh-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 2s ease; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .scroll-reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .scroll-reveal.visible { opacity: 1; transform: translateY(0); }
        
        /* Locking Logic */
        #unlockedContent { display: none; opacity: 0; transition: opacity 1.5s ease; }
        #gatekeeperGate { transition: opacity 0.8s ease; }
    </style>
</head>

        </div>
    </div>

            <a href="bio.html" class="px-5 py-2 glass-card rounded-full text-[10px] uppercase tracking-[0.2em] hover:bg-white/10 transition-all">Personnel Logs</a>
        </nav>

                    <span class="text-[10px] font-bold uppercase tracking-[0.3em] text-gatekeeper-300">Authorized Access Only</span>
