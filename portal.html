<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHELGARD // GATEWAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #000;
            color: #3449ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .portal-box {
            text-align: center;
            padding: 40px;
            border: 1px solid rgba(52, 73, 255, 0.3);
            background: rgba(52, 73, 255, 0.02);
            backdrop-filter: blur(10px);
            border-radius: 2px;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #3449ff;
            color: #fff;
            padding: 10px;
            text-align: center;
            outline: none;
            width: 280px;
            font-size: 1.5rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        input:focus {
            border-bottom-color: #fff;
            box-shadow: 0 10px 20px -10px rgba(52, 73, 255, 0.5);
        }

        .status-text {
            margin-top: 20px;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.6;
        }

            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
