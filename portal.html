<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHELGARD // ELITE_PORTAL</title>
    <style>
        body { background-color: #050505; color: #00ff88; font-family: 'Courier New', monospace; margin: 0; padding: 40px; }
        .container { max-width: 850px; margin: 0 auto; border: 1px solid #1a1a1a; padding: 35px; background: #080808; }
        .nav-header { border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 40px; }
        .back-link { color: #fff; text-decoration: none; border: 1px solid #fff; padding: 8px 15px; font-size: 0.7rem; text-transform: uppercase; }
        .back-link:hover { background: #fff; color: #000; }
        .terminal-input-wrap { background: #000; border: 1px solid #333; padding: 20px; margin-top: 40px; }
        #cmdInput { background: transparent; border: none; color: #00ff88; outline: none; font-family: inherit; width: 80%; font-size: 1rem; }
        #hiddenVault { display: none; margin-top: 20px; padding: 20px; border: 1px dashed #00ff88; background: rgba(0, 255, 136, 0.05); }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-header">
            <a href="index.html" class="back-link">< RETURN_TO_HUB</a>
        </div>

        <h1 style="letter-spacing: 10px; color: #fff;">ELITE_PORTAL</h1>
        <p style="color: #444; font-size: 0.7rem;">LEVEL 5 ACCESS REQUIRED</p>

        <div class="terminal-input-wrap">
            <span style="font-size: 0.6rem; color: #444; display: block; margin-bottom: 10px;">ENTER_OVERRIDE_CODE:</span>
            <div style="display: flex;">
                <span style="margin-right: 10px;">></span>
                <input type="text" id="cmdInput" placeholder="CODE_HERE..." autocomplete="off">
            </div>

            <div id="hiddenVault">
                <h3 style="color: #fff; margin: 0 0 10px 0;">[ ACCESS_GRANTED ]</h3>
                <p style="font-size: 0.7rem; color: #888;">UNRELEASED_TRACKS_VAULT: <a href="#" style="color: #00ff88;">PRIVATE_LINK_01.EXE</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('cmdInput').addEventListener('input', (e) => {
            if (e.target.value.toUpperCase() === 'AETHELGARD') {
                document.getElementById('hiddenVault').style.display = 'block';
                e.target.value = 'AUTHORIZED';
                e.target.disabled = true;
            }
        });
    </script>
</body>
</html>
