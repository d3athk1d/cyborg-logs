<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHELGARD // ELITE PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gatekeeper: {
                            50: '#f0f4ff', 100: '#d9e2ff', 200: '#bbcbff', 300: '#8da6ff',
                            400: '#5876ff', 500: '#3449ff', 600: '#1e26ff', 700: '#1418ff',
                            800: '#1215cc', 900: '#1619a0', 950: '#0a0b5e',
                        },
                        ethereal: '#0a0a0c',
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        body: ['Space+Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0c; color: #ffffff; margin: 0; overflow-x: hidden; }
        
        /* THE LOCK SCREEN STYLES */
        #gatekeeper-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050505; display: flex; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.8s ease, visibility 0.8s;
        }
        .terminal-box {
            border: 1px solid #1a1a1a; padding: 40px; background: #080808;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.05); text-align: center; width: 90%; max-width: 400px;
        }
        .terminal-input {
            background: transparent; border: none; border-bottom: 1px solid #333;
            color: #00ff88; outline: none; font-family: 'Courier New', monospace;
            width: 100%; font-size: 1.2rem; text-transform: uppercase; text-align: center; padding: 10px 0;
        }

        /* THE MAIN SITE STYLES (From your file) */
        #main-site-content { display: none; opacity: 0; transition: opacity 1.5s ease; }
        .mesh-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
        .scroll-reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .scroll-reveal.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="font-body">

    <div id="gatekeeper-gate">
        <div class="terminal-box">
            <h1 style="color: #fff; font-family: 'Courier New', monospace; letter-spacing: 5px; font-size: 1rem; margin-bottom: 20px;">ACCESS_RESTRICTED</h1>
            <input type="text" id="passInput" placeholder="ENTER_CODE" class="terminal-input" autocomplete="off">
        </div>
    </div>

    <div id="main-site-content">
        <div class="mesh-bg"></div>
