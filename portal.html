<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AETHELGARD // GATEWAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        input { background: transparent; border: 1px solid #00ff00; color: #00ff00; padding: 10px; text-align: center; outline: none; width: 300px; font-size: 1.2rem; letter-spacing: 4px; }
    </style>
</head>
<body>
    <div class="text-center">
        <div class="mb-4 opacity-50 text-xs">ENTER_ENCRYPTION_KEY</div>
        <input type="password" id="key" maxlength="10" autocomplete="off" autofocus>
        <div id="status" class="mt-4 text-[10px] uppercase tracking-widest">Awaiting_Input...</div>
    </div>

    <script>
        const input = document.getElementById('key');
        const status = document.getElementById('status');

        input.addEventListener('input', (e) => {
            if (e.target.value.toUpperCase() === 'AETHELGARD') {
                status.innerText = "ACCESS_GRANTED... REDIRECTING";
                input.style.borderColor = "#fff";
                input.style.color = "#fff";
                setTimeout(() => {
                    // This sends you to the NEW page you just made
                    window.location.href = "elite.html"; 
                }, 1000);
            }
        });
    </script>
</body>
</html>
